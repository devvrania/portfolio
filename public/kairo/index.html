<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kairo</title>
<link rel="icon" href="./favicon.ico" sizes="48x48">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
  :root { --ink:#e6ebf3; --muted:#8e98aa; --accent:#ff3b5c; --panel:rgba(20,14,20,.72); --line:#3a2a34; --btn:#22171e; }
  html,body { margin:0; height:100%; background:#0e0a10; font-family: "Inter", system-ui, -apple-system, sans-serif; color:var(--ink); overflow:hidden; }
  canvas { display:block; }
  .hud { position:fixed; top:16px; left:16px; width:280px; background:var(--panel); backdrop-filter: blur(8px);
         border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; font-size:13px; }
  .hud[hidden] { display:none; }
  .hud h1 { font-size:15px; margin:0; }
  .row { display:flex; flex-wrap:wrap; gap:6px; }
  .lbl { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  button { font:600 12px inherit; font-family:inherit; border:1px solid var(--line); background:var(--btn); color:var(--ink);
           border-radius:999px; padding:5px 11px; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .read { font-family: ui-monospace, Menlo, monospace; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .note { font-size:11px; color:var(--muted); line-height:1.45; }
  /* loader, shown until the model is in (main.js fades it out). The bar has two layers: a CSS creep that keeps moving
     while the model is being set up (that blocks the main thread, freezing anything driven by JS) and the real
     download progress; you see whichever is further along. The portfolio reads "N%" from #status, hence #loadPct. */
  #status { position:fixed; inset:0; z-index:5; display:grid; place-items:center; background:#0e0a10; font-size:14px; color:var(--muted);
            pointer-events:none; transition:opacity .6s; }
  #status.done { opacity:0; }
  .loader { display:flex; flex-direction:column; align-items:center; width:min(20rem, 80vw); }
  .ring { position:relative; width:104px; height:104px; }
  .ring img { width:100%; height:100%; border-radius:50%; box-shadow:0 0 0 1px var(--line); }
  .ring::before { content:""; position:absolute; inset:-7px; border-radius:50%; border:2px solid transparent;
                  border-top-color:var(--accent); border-right-color:rgba(244,166,192,.6); animation:spin 3s linear infinite; }
  .line { margin:26px 0 0; font:13px ui-monospace, Menlo, monospace; color:var(--ink); white-space:nowrap; }
  .line .who { color:#f4a6c0; }
  .line .caret { color:var(--accent); animation:blink 1s steps(1) infinite; }
  .bar { position:relative; width:100%; height:4px; margin-top:14px; border-radius:99px; overflow:hidden; background:var(--line); }
  .bar i { position:absolute; inset:0; transform-origin:left; background:#fff; border-radius:99px; }
  .bar .creep { animation:creep 7.5s cubic-bezier(.15,.6,.3,1) forwards; }
  .bar .real { transform:scaleX(0); transition:transform .3s ease-out; }
  .bar b { position:absolute; inset:0; background:linear-gradient(90deg, var(--accent), #f4a6c0); mix-blend-mode:multiply; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes blink { 50% { opacity:0; } }
  @keyframes creep { from { transform:scaleX(.03); } to { transform:scaleX(.9); } }
  @media (prefers-reduced-motion: reduce) { .ring::before, .line .caret { animation:none; } }
  /* name tag and speech bubble, anchored above Kairo's head every frame */
  .tag { position:fixed; left:0; top:0; transform:translate(-50%,-100%); pointer-events:none; text-align:center;
         display:flex; flex-direction:column; align-items:center; gap:5px; white-space:nowrap; opacity:0; transition:opacity .4s; }
  .tag b { font-size:15px; letter-spacing:.04em; padding:3px 13px; border-radius:999px; background:rgba(14,10,16,.8);
           border:1px solid rgba(255,59,92,.55); box-shadow:0 0 18px rgba(255,59,92,.25); }
  @media (prefers-reduced-motion: reduce) { .bubble { transition:none; } }
  .bubble { position:fixed; left:0; top:0; transform:translate(14px,-100%); max-width:240px; pointer-events:none;
            background:#f2f5fa; color:#151a24; font-size:13px; line-height:1.45; padding:10px 13px; border-radius:14px 14px 14px 4px;
            box-shadow:0 8px 24px rgba(0,0,0,.35); opacity:0; transition:opacity .35s, transform .35s; }
  .bubble.show { opacity:1; transform:translate(14px,calc(-100% - 6px)); }
  .hint { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); font-size:12px; color:var(--muted); pointer-events:none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.0/lib/three-vrm.module.js"
} }
</script>
</head>
<body>
<div id="status" role="status" aria-label="Loading Kairo">
  <div class="loader">
    <div class="ring"><img src="./loader-avatar.jpg" alt=""></div>
    <p class="line"><span class="who">kairo</span> ~ <span id="loadLine">waking up</span><span class="caret">▍</span></p>
    <div class="bar"><i class="creep"></i><i class="real" id="loadBar"></i><b></b></div>
    <span id="loadPct" hidden>0%</span>
  </div>
</div>
<div class="tag" id="tag"><b>Kairo</b></div>
<div class="bubble" id="bubble"></div>
<div class="hint">Click Kairo to say hi · drag to look around · scroll to zoom</div>
<div class="hud" hidden>
  <h1>Kairo · debug</h1>
  <div>
    <div class="lbl">Gaze</div>
    <div class="row" id="gaze">
      <button data-v="cursor" aria-pressed="true">Follow cursor</button>
      <button data-v="screen" aria-pressed="false">Watch screen</button>
    </div>
  </div>
  <div>
    <div class="lbl">Expression</div>
    <div class="row" id="expr">
      <button data-v="auto" aria-pressed="true">Auto</button>
      <button data-v="relaxed" aria-pressed="false">Calm</button>
      <button data-v="neutral" aria-pressed="false">Neutral</button>
      <button data-v="happy" aria-pressed="false">Joy</button>
      <button data-v="Surprised" aria-pressed="false">Surprised</button>
    </div>
  </div>
  <div class="row">
    <button id="typing" aria-pressed="true">Typing</button>
    <button id="orbit" aria-pressed="false">Free camera</button>
  </div>
  <div class="read" id="read">—</div>
  <div class="note">D hides this panel · S stretch · W look outside</div>
  <div class="note">Model: AvatarSample_C by VRoid Project. Licensed for avatar use, redistribution and commercial use, credit not required.</div>
</div>
<script>
  // If anything stops Kairo from coming in (a CDN import that won't download, an error while building his room),
  // say so in #status. The portfolio watches for "Could not load" so it can stop waiting and keep its banner.
  (() => {
    const fail = () => {
      const s = document.getElementById('status');
      if (s && !s.classList.contains('done') && !s.textContent.startsWith('Could not load')) {
        s.textContent = 'Could not load Kairo. Reload the page to try again.';
      }
    };
    addEventListener('error', e => { if (e instanceof ErrorEvent || e.target?.tagName === 'SCRIPT') fail(); }, true);
    addEventListener('unhandledrejection', fail);
  })();
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
